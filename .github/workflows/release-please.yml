name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      clockin: ${{ steps.rp.outputs['packages/clockin--release_created'] }}
      dimacon: ${{ steps.rp.outputs['packages/dimacon--release_created'] }}
      lexoffice: ${{ steps.rp.outputs['packages/lexoffice--release_created'] }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-clockin:
    needs: release-please
    if: needs.release-please.outputs.clockin == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: clockin

  publish-dimacon:
    needs: release-please
    if: needs.release-please.outputs.dimacon == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: dimacon

  publish-lexoffice:
    needs: release-please
    if: needs.release-please.outputs.lexoffice == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-npm-package.yml
    with:
      package: lexoffice
